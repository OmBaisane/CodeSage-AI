<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brandSageH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="brandEmeraldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background container for dark preview -->
  <rect width="420" height="100" rx="14" fill="#09090B" />

  <!-- Icon Section (Scaled at x=20, y=10) -->
  <g transform="translate(16, 10) scale(0.666)">
    <!-- Rounded border frame -->
    <rect width="120" height="120" rx="26" fill="#111827" stroke="#1F2937" stroke-width="2" />
    
    <!-- Code Brackets -->
    <path d="M 44 42 L 28 60 L 44 78" fill="none" stroke="url(#brandSageH)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 76 42 L 92 60 L 76 78" fill="none" stroke="url(#brandSageH)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Lens Diamond & Center -->
    <path d="M 60 45 L 71 60 L 60 75 L 49 60 Z" fill="none" stroke="url(#brandEmeraldH)" stroke-width="4.5" stroke-linejoin="round" />
    <circle cx="60" cy="60" r="3.5" fill="#34D399" />
  </g>

  <!-- Typography: CodeSage AI -->
  <g transform="translate(112, 59)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="700" font-size="30" fill="#F8FAFC" letter-spacing="-0.5">Code<tspan fill="#818CF8">Sage</tspan></text>
  </g>

  <!-- AI Badge -->
  <g transform="translate(262, 38)">
    <rect width="42" height="24" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
    <text x="21" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#A5B4FC" text-anchor="middle" letter-spacing="1">AI</text>
  </g>

  <!-- Subtitle / Brand Tagline -->
  <g transform="translate(114, 78)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="11" fill="#94A3B8" letter-spacing="1.2">PRECISION CODE INTELLIGENCE</text>
  </g>
</svg>