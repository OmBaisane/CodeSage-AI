<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="emeraldFocus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="lensBacking" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0.95" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Canvas Base -->
  <rect width="120" height="120" rx="28" fill="#09090B" stroke="#1F2937" stroke-width="2" />

  <!-- Inner Backing Glow -->
  <circle cx="60" cy="60" r="38" fill="url(#lensBacking)" stroke="#312E81" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Left Code Bracket < -->
  <path d="M 44 42 L 28 60 L 44 78" 
        fill="none" 
        stroke="url(#sageGlow)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right Code Bracket > -->
  <path d="M 76 42 L 92 60 L 76 78" 
        fill="none" 
        stroke="url(#sageGlow)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Sage AI Core: Diamond / Verification Node -->
  <path d="M 60 45 L 71 60 L 60 75 L 49 60 Z" 
        fill="none" 
        stroke="url(#emeraldFocus)" 
        stroke-width="4.5" 
        stroke-linejoin="round" 
        filter="url(#subtleGlow)" />

  <!-- Central Laser Precision Dot -->
  <circle cx="60" cy="60" r="3.5" fill="#34D399" />
</svg>